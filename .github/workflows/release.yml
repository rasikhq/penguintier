name: Release

# Pushing a version tag (git tag v0.1.0 && git push origin v0.1.0) builds
# the .deb and .rpm and publishes them, with SHA256SUMS, as a GitHub Release.
#
# The tag name is the version: tag v0.1.0 -> penguintier 0.1.0. Tags with a
# suffix, like v0.2.0-rc.1, become a GitHub "pre-release".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never cancel a release halfway through.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # First the same build and install tests as on every PR (package.yml).
  # Nothing is published unless they pass on every distro.
  test:
    uses: ./.github/workflows/package.yml

  release:
    name: Build and publish
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      # Create the GitHub Release and upload its files.
      contents: write
    # Same container as package.yml: penguintier-ui gets the glibc 2.36
    # floor of Debian 12. The steps match package.yml's build job.
    container: debian:12
    steps:
      - name: Install build tools and GTK/WebKitGTK headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git make gcc libc6-dev pkg-config unzip \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/checkout@v7
        with:
          # Full history and tags: GoReleaser writes the release notes from
          # the commits since the previous tag.
          fetch-depth: 0

      - name: Mark the checkout as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            ui/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install the Wails CLI (same version as ui/go.mod)
        working-directory: ui
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"

      - name: Install frontend dependencies (must match bun.lock)
        working-directory: ui/frontend
        run: bun install --frozen-lockfile

      # Builds everything (including `make ui-build`), writes SHA256SUMS and
      # creates the GitHub Release for this tag with the .deb, .rpm and
      # SHA256SUMS attached.
      - name: Build and publish (GoReleaser)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Keep in sync with GORELEASER_VERSION in the Makefile.
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
