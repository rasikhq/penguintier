name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or PR cancels the older, now outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go lint, test and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Uses the toolchain line in go.mod: the same Go as local builds.
          go-version-file: go.mod

      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal ui/*.go)
          if [ -n "$out" ]; then
            echo "::error::These files need gofmt (run 'make fmt'):"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.15.0
          # Build it with the pinned Go (like `make tools`): a prebuilt
          # binary made with an older Go refuses to lint newer-Go code.
          install-mode: goinstall

      - name: Test (race detector)
        run: go test -race ./...

      - name: Test the patched fyne.io/systray copy
        # third_party/fyne-systray is its own Go module, so `./...` above
        # skips it. See third_party/fyne-systray/PENGUINTIER.md.
        working-directory: third_party/fyne-systray
        run: go test -race ./...

      - name: Build without cgo (static binaries)
        run: CGO_ENABLED=0 go build ./...

  vuln:
    name: govulncheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Reports known vulnerabilities in dependencies and in the Go standard
      # library that our code can actually reach. A stdlib finding usually
      # means: bump the toolchain line in go.mod and ui/go.mod.
      - name: govulncheck
        run: make vuln

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Fails if any dependency uses a license outside ALLOWED_LICENSES in
      # the Makefile (for example GPL, which would not fit an MIT project).
      - name: go-licenses
        run: make licenses

  ui:
    name: UI build (Wails)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ui/go.mod
          cache-dependency-path: ui/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install GTK and WebKitGTK headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install the Wails CLI (same version as ui/go.mod)
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"

      - name: Install frontend dependencies (must match bun.lock)
        working-directory: ui/frontend
        run: bun install --frozen-lockfile

      - name: Build
        run: wails build -tags webkit2_41 -trimpath

      # The build made frontend/dist, which main.go embeds, so vet and this
      # module's Go tests can run now. golangci-lint covers the root module
      # only, see .golangci.yml.
      - name: go vet and test
        run: |
          go vet -tags webkit2_41 .
          go test -tags webkit2_41 .

      # CI has no display, so only check argv handling: an unknown screen
      # name must exit 2 before any window opens.
      - name: Check the binary starts
        run: |
          set +e
          ./build/bin/penguintier-ui bogus
          code=$?
          if [ "$code" -ne 2 ]; then echo "::error::expected exit code 2 for an unknown screen, got $code"; exit 1; fi
