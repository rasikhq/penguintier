name: Packages

# Builds the .deb and .rpm exactly like a release (but with a snapshot
# version and no upload), then installs them in clean containers of each
# supported distro and checks the result (packaging/scripts/smoke-test.sh).
#
# release.yml also runs this workflow ("workflow_call") before it publishes.

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or PR cancels the older, now outdated run.
concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build packages (in debian:12)
    runs-on: ubuntu-24.04
    # penguintier-ui links against the system's glibc. Building it on
    # Debian 12 (glibc 2.36, the oldest we support) makes it run on every
    # newer distro too. The Go programs are static, so they don't care.
    container: debian:12
    steps:
      # Before checkout: without git, actions/checkout downloads a tarball
      # instead of a git clone, and GoReleaser needs the git history.
      - name: Install build tools and GTK/WebKitGTK headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git make gcc libc6-dev pkg-config unzip \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/checkout@v7
        with:
          # Full history and tags: GoReleaser derives the version from them.
          fetch-depth: 0

      # The checkout belongs to another user than the container's root, and
      # git refuses to work in such a directory unless it is marked safe.
      - name: Mark the checkout as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-go@v7
        with:
          # Uses the toolchain line in go.mod: the same Go as local builds.
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            ui/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install the Wails CLI (same version as ui/go.mod)
        working-directory: ui
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"

      - name: Install frontend dependencies (must match bun.lock)
        working-directory: ui/frontend
        run: bun install --frozen-lockfile

      # Runs `make ui-build` first (the "before" hook in .goreleaser.yaml),
      # then builds the Go programs and the packages into dist/.
      - name: Build packages (GoReleaser snapshot)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Keep in sync with GORELEASER_VERSION in the Makefile.
          version: v2.18.3
          args: release --snapshot --clean

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          if-no-files-found: error

  install-test:
    name: Install test (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      # Run every distro even if one fails, to see all failures at once.
      fail-fast: false
      matrix:
        image: [debian:12, debian:13, ubuntu:24.04, fedora:latest]
    container: ${{ matrix.image }}
    steps:
      # Only needs the files (no git history), so no git install first.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist

      # Installs, checks files and modes, runs `penguintier --version` and
      # `systemd-analyze verify`, upgrades, removes, reinstalls and purges.
      - name: Smoke test
        run: bash packaging/scripts/smoke-test.sh dist
