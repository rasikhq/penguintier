# System user for penguintier-dnsd (see sysusers.d(5)). Installed to
# /usr/lib/sysusers.d/; the package's postinstall runs
# `systemd-sysusers penguintier.conf`.
#
# "u" creates a system user with a free UID from the system range (once;
# later runs keep it) and a group of the same name. Home "-" means "/", and
# shell "-" means the distribution's nologin, so nobody can log in as this
# user. It owns no files: it only talks to D-Bus and the local ZeroTier API.
#Type Name            ID GECOS                    Home Shell
u     penguintier-dns -  "Penguintier DNS daemon" -    -
